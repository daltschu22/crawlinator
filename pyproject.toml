[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlinator"
version = "0.1.0"
description = "Inspect filesystem sizes and find stale subdirectories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
crawlinator = "crawlinator:main"

[tool.setuptools]
py-modules = ["crawlinator"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
